name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run unit tests
        run: cargo test --verbose

      - name: Run CLI on safe-upgrade (expected: exit 0)
        run: |
          cargo run --bin soroban-drift-cli -- \
            examples/safe-upgrade/old \
            examples/safe-upgrade/new \
            --format json \
            --fail-on breaking
        if: success()

      - name: Run CLI on breaking-upgrade (expected: exit 1)
        run: |
          cargo run --bin soroban-drift-cli -- \
            examples/breaking-upgrade/old \
            examples/breaking-upgrade/new \
            --format json \
            --fail-on breaking || exit_code=$? && test $exit_code -eq 1
        if: success()
