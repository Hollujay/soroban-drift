[package]
name = "soroban-drift-cli"
version = "0.1.0"
description = "CLI tool for detecting breaking changes in Soroban smart contracts"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
soroban-drift-core = { path = "../core" }
clap = { version = "4.6.3", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
