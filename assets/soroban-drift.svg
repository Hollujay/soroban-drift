<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Red Diff Highlight -->
    <linearGradient id="red-diff" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Green Diff Highlight -->
    <linearGradient id="green-diff" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Soft Glow Effects -->
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" result="blur"/>
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Glowing Accent Orbs -->
  <circle cx="150" cy="80" r="180" fill="#7C3AED" fill-opacity="0.15" filter="url(#glow-purple)"/>
  <circle cx="1050" cy="320" r="220" fill="#06B6D4" fill-opacity="0.12" filter="url(#glow-cyan)"/>
  <circle cx="650" cy="200" r="130" fill="#EF4444" fill-opacity="0.07" filter="url(#glow-purple)"/>

  <!-- Top Decorative Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#brand-grad)"/>

  <!-- LEFT COLUMN: Branding & Key Information -->
  <g transform="translate(70, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 65)">
      <rect width="265" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#06B6D4"/>
      <text x="30" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#CBD5E1" letter-spacing="1">SOROBAN SMART CONTRACTS</text>
    </g>

    <!-- Project Title -->
    <g transform="translate(0, 142)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
        soroban<tspan fill="#A78BFA">-drift</tspan>
      </text>
    </g>

    <!-- Subtitle / Short Description -->
    <text x="0" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">
      Static-analysis CLI to detect breaking storage layout, auth,
    </text>
    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">
      and signature changes before deployment.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 250)">
      <!-- Storage Pill -->
      <g transform="translate(0, 0)">
        <rect width="140" height="32" rx="8" fill="#1E293B" stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1"/>
        <circle cx="16" cy="16" r="3" fill="#A78BFA"/>
        <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#DDD6FE">Storage Layout</text>
      </g>

      <!-- Auth Pill -->
      <g transform="translate(150, 0)">
        <rect width="155" height="32" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-opacity="0.5" stroke-width="1"/>
        <circle cx="16" cy="16" r="3" fill="#67E8F9"/>
        <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#CFFAFE">Auth Regressions</text>
      </g>

      <!-- Signatures Pill -->
      <g transform="translate(315, 0)">
        <rect width="145" height="32" rx="8" fill="#1E293B" stroke="#10B981" stroke-opacity="0.5" stroke-width="1"/>
        <circle cx="16" cy="16" r="3" fill="#6EE7B7"/>
        <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#D1FAE5">Signature Diffs</text>
      </g>
    </g>

    <!-- Maintainer Metadata -->
    <g transform="translate(0, 328)">
      <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#64748B">
        <tspan fill="#475569">maintainer:</tspan> @Hollujay  <tspan fill="#334155">•</tspan>  <tspan fill="#475569">lang:</tspan> Rust 2021
      </text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Simulated CLI Diff Terminal Window -->
  <g transform="translate(620, 48)">
    <!-- Terminal Outer Frame -->
    <rect width="510" height="304" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

    <!-- Terminal Header Bar -->
    <path d="M 0 10 C 0 4.47 4.47 0 10 0 L 500 0 C 505.53 0 510 4.47 510 10 L 510 36 L 0 36 Z" fill="#1E293B"/>
    <line x1="0" y1="36" x2="510" y2="36" stroke="#334155" stroke-width="1"/>

    <!-- macOS Style Window Buttons -->
    <circle cx="18" cy="18" r="5.5" fill="#EF4444"/>
    <circle cx="34" cy="18" r="5.5" fill="#F59E0B"/>
    <circle cx="50" cy="18" r="5.5" fill="#10B981"/>

    <!-- Window Title -->
    <text x="255" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#94A3B8" font-weight="500">soroban-drift-cli</text>

    <!-- Terminal Output Content -->
    <g transform="translate(20, 52)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">
      <!-- Command Prompt -->
      <text x="0" y="14" fill="#38BDF8">$ soroban-drift old/ new/ --fail-on breaking</text>

      <!-- Status Header -->
      <text x="0" y="38" fill="#F87171" font-weight="700">✖ BREAKING CHANGES DETECTED</text>

      <!-- Storage Section -->
      <text x="0" y="64" fill="#A78BFA" font-weight="600">■ storage layout drift</text>

      <!-- Storage Diff Box -->
      <rect x="10" y="72" width="460" height="20" rx="4" fill="url(#red-diff)"/>
      <text x="18" y="86" fill="#FCA5A5">- Old: Balance { amount: i128, owner: Address }</text>

      <rect x="10" y="96" width="460" height="20" rx="4" fill="url(#green-diff)"/>
      <text x="18" y="110" fill="#6EE7B7">+ New: Balance { amount: u32,  owner: Address }</text>

      <!-- Auth Section -->
      <text x="0" y="142" fill="#A78BFA" font-weight="600">■ auth regression</text>

      <!-- Auth Diff Box -->
      <rect x="10" y="150" width="460" height="38" rx="4" fill="url(#red-diff)"/>
      <text x="18" y="165" fill="#FCA5A5">- Function 'transfer' dropped require_auth()</text>
      <text x="18" y="180" fill="#94A3B8" font-size="10.5">  Old: require_auth  |  New: (none)</text>

      <!-- CI Exit Banner -->
      <g transform="translate(10, 202)">
        <rect width="460" height="24" rx="4" fill="#7F1D1D" fill-opacity="0.35" stroke="#EF4444" stroke-width="0.8" stroke-dasharray="3 3"/>
        <circle cx="14" cy="12" r="3" fill="#EF4444"/>
        <text x="24" y="16" fill="#FECACA" font-size="10.5" font-weight="600">CI Exit Code: 1 (Breaking change threshold reached)</text>
      </g>
    </g>
  </g>
</svg>
